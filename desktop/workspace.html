<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Browser</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei UI",sans-serif;background:#f3f5fa;color:#242640}.bar{height:48px;display:flex;align-items:end;padding:0 12px;background:#eef0f7;border-bottom:1px solid #dfe2ed}.tab{height:38px;border:0;background:transparent;padding:0 18px;border-radius:11px 11px 0 0;color:#7c8298;cursor:pointer}.tab.active{background:#fff;color:#282b47;font-weight:650}.pane{display:none;height:calc(100% - 48px)}.pane.active{display:block}.info{padding:34px;overflow:auto}.card{max-width:820px;margin:auto;background:white;border:1px solid #e7e9f1;border-radius:20px;padding:26px;box-shadow:0 16px 50px rgba(72,70,119,.09)}h1{margin:0 0 8px;font-size:24px}.sub{color:#83899d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.item{padding:15px;border-radius:13px;background:#f6f7fb}.item b,.item span{display:block}.item span{margin-top:5px;color:#7f8598;font-size:13px}webview{width:100%;height:100%;border:0;background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="bar"><button class="tab active" data-pane="info">工作台配置</button><button class="tab" data-pane="google">Google</button></div><section class="pane info active" id="info"><div class="card"><h1 id="title">当前窗口配置</h1><div class="sub">此窗口使用独立的 Cookie、缓存和本地存储。</div><div class="grid" id="grid"></div></div></section><section class="pane" id="google"><webview src="https://www.google.com/" allowpopups></webview></section><script>const params=new URLSearchParams(location.search),config=JSON.parse(decodeURIComponent(params.get('config')||'%7B%7D'));document.querySelector('#title').textContent=config.name?config.name+' · 当前配置':'当前窗口配置';const items=[['浏览器',config.browser||'Chromium'],['操作系统',config.os||'Windows 11'],['语言',config.language||'跟随系统'],['窗口尺寸',config.size||'1280 × 820'],['代理',config.proxy||'未启用'],['插件',(config.plugins||[]).join('、')||'未启用']];document.querySelector('#grid').innerHTML=items.map(x=>'<div class="item"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelector('#'+tab.dataset.pane).classList.add('active')});</script></body></html>
